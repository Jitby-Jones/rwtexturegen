# Bionic armor suit in the marine / recon / cataphract lineage.
#   * marine: proud flared shoulder pads, collar yoke around a foreshortened neck ring,
#     V-neck chest plate, belt with a node, splayed tassets
#   * recon: segmented abdomen plates, slimmer read on Thin bodies
#   * cataphract: raised pad line and heavy chest facets
#   * bionic: artificial-muscle undersuit (DMS bionic suit), exposed bionic joint caps,
#     segmented bionic spine with cyan nodes, chest power core; faceless helm with a sensor
#     band and ONE bionic eye using the vanilla bionic-eye palette (light plate, black ring,
#     teal lens), ear ports and a neural port at the back.
# Plates are authored on the 3D torso/head proxies (rwtex/form.py), so they follow
# perspective and fit all 5 body types x 3 directions automatically.
# Shell plates are white and masked red so ideology/stuff colours tint the armor.
name: BionicAssaultArmor
archetype: armor
style: bionic
size: 128
seed: 2
params:
  design: bionic
output:
  dir: output/apparel/BionicAssaultArmor
  tex_root: Things/Pawn/Humanlike/Apparel
preview:
  stuff: [Plasteel]
  tints: {olive_dye: [0.55, 0.62, 0.42]}
items:
  - name: BionicAssaultHelmet
    archetype: helmet
    style: bionic
    params: {design: bionic}
