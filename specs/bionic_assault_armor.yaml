# Bionic armor suit in the marine / recon / cataphract lineage.
#   * the vanilla marine construction (rwtex/archetypes/armor3d.py: marine_kit), fitted to every
#     body type from measurements of vanilla PowerArmor: shell that hugs the body, big neck ring
#     with a light lip, chest plate with chamfer facets and black-dark-black seams, near-black
#     belt that tilts in the east view, three tassets, east pauldron, north spine;
#   * bionic: artificial-muscle undersuit (DMS bionic suit), a segmented bionic spine with cyan
#     nodes in place of the back plate, a chest power core and a bionic belt node, cyan seams on
#     the chest chamfers, an exposed bionic joint cap on the pauldron;
#   * helmet: closed white helm (the DMS bionic suit's featureless mask made into armor) with a
#     dark sensor band, ONE bionic eye in the vanilla bionic-eye palette (light plate, black
#     ring, teal lens), ear ports and a neural port continuing the spine.
# Shell plates are white and masked red so ideology/stuff colours tint the armor.
name: BionicAssaultArmor
archetype: armor
style: bionic
size: 128
seed: 2
params:
  design: bionic
output:
  dir: output/apparel/BionicAssaultArmor
  tex_root: Things/Pawn/Humanlike/Apparel
preview:
